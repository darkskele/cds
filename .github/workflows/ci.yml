# Builds every preset and runs the tests on pull requests into main.
# Benchmarks are built, never run. Shared runners give no useful numbers.
name: ci

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [release, debug, tsan]
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake ninja-build ccache libgtest-dev

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.preset }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build build/${{ matrix.preset }}

      # TSan cannot map its shadow memory with ASLR on.
      - name: Test
        run: |
          if [ "${{ matrix.preset }}" = tsan ]; then
            setarch "$(uname -m)" -R ctest --test-dir build/tsan --output-on-failure
          else
            ctest --test-dir build/${{ matrix.preset }} --output-on-failure
          fi
